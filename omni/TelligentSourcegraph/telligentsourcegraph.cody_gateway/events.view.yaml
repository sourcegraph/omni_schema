# Reference this view as telligentsourcegraph_cody_gateway__events
catalog: telligentsourcegraph
schema: cody_gateway
table_name: events

dimensions:
  name:
    description: The name of the event

  source:
    description: The source of the event

  identifier:
    description: The identifier of the actor

  metadata:
    description: The event-specific metadata

  created_at:
    description: The event capture time

measures:
  count:
    aggregate_type: count
