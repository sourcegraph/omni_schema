# Reference this view as telligentsourcegraph_looker_precomputed__daily_active_users
description: Pre-aggregated daily/weekly/monthly active user counts by server
  for Looker dashboards. Replaces expensive DAU/MAU queries that scan full
  v2_events table.

catalog: telligentsourcegraph
schema: looker_precomputed
table_name: daily_active_users

dimensions:
  activity_date: {}
  total_unique_users: {}
  billing_active_users: {}
  core_active_users: {}
  cody_billing_active_users: {}
  search_billing_active_users: {}
  cody_core_active_users: {}
  search_core_active_users: {}
  batch_billing_active_users: {}
  insight_billing_active_users: {}
  total_events: {}
  activity_week: {}
  activity_month: {}

  external_url:
    sql: externalUrl

  workspace_id:
    sql: workspaceId
    format: ID

measures:
  count:
    aggregate_type: count
