# Reference this view as telligentsourcegraph_enterprise_portal__subscription_licenses
description: Enterprise Portal Subscription Licenses data sourced via EXTERNAL_QUERY

catalog: telligentsourcegraph
schema: enterprise_portal
table_name: subscription_licenses

dimensions:
  created_at: {}
  revoked_at: {}
  license_data: {}
  expire_at: {}
  license_type: {}

  subscription_id:
    format: ID

  id:
    format: ID
    primary_key: true

  detected_instance_id:
    format: ID

  datastream_metadata:
    parent_field: datastream_metadata

  datastream_metadata_source_timestamp:
    sql: datastream_metadata.source_timestamp
    parent_field: datastream_metadata

  datastream_metadata_uuid:
    sql: datastream_metadata.`uuid`
    parent_field: datastream_metadata

measures:
  count:
    aggregate_type: count
