# Reference this view as telligentsourcegraph_workspaces_transformed__repo_raw
catalog: telligentsourcegraph
schema: workspaces_transformed
table_name: repo_raw

dimensions:
  subscription_name:
    description: |2-
      	
      pubsub topic subscription

  message_id:
    format: ID
    description: unique id of the message

  publish_time:
    description: time message was published in our system

  data:
    description: payload

  attributes:
    description: payload metadata

measures:
  count:
    aggregate_type: count
