  seat_consumption_p1:
    group_label: Seat Consumption

  seat_consumption_p2:
    group_label: Seat Consumption

  seat_consumption_p3:
    group_label: Seat Consumption

  seat_consumption_pp_p0p1:
    format: percent_1
    group_label: Seat Consumption

  seat_consumption_pp_p1p2:
    format: percent_1
    group_label: Seat Consumption

  seat_consumption_pp_p2p3:
    format: percent_1
    group_label: Seat Consumption

  # ── Power users by period ──────────────────────────────────────
  power_pct_p0:
    format: percent_1
    group_label: Power Users

  power_pct_p1:
    format: percent_1
