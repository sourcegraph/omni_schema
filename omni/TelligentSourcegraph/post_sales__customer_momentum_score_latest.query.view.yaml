measures:
  count:
    drill_fields: [ account_name ]
    aggregate_type: count

  avg_momentum_score:
    sql: ${momentum_score}
    label: Momentum Score
    format: percent_0
    drill_fields:
      [
        account_name,
        sfdc_unique_id,
        run_date,
        segmentation,
        dimensions_positive,
        dimensions_stable,
        dimensions_negative
      ]
    aggregate_type: average

  total_iacv:
    sql: ${iacv}
    label: IACV
    format: usdcurrency_0
    drill_fields:
      [
        account_name,
        sfdc_unique_id,
        run_date,
        segmentation,
        dimensions_positive,
        dimensions_stable,
        dimensions_negative
      ]
    aggregate_type: sum

  distinct_accounts:
    sql: ${account_name}
    label: Distinct Accounts
    drill_fields:
      [
        account_name,
        sfdc_unique_id,
        run_date,
        segmentation,
        dimensions_positive,
        dimensions_stable,
        dimensions_negative
      ]
    aggregate_type: count_distinct

  # ── Band counts (not in LookML, cheap to add) ──────────────────
  accounts_expansion_signal:
    sql: CASE WHEN momentum_band = 'Expansion Signal' THEN 1 END
    label: Accounts - Expansion Signal
    aggregate_type: count

  accounts_accelerating:
    sql: CASE WHEN momentum_band = 'Accelerating' THEN 1 END
    label: Accounts - Accelerating
    aggregate_type: count

  accounts_stable:
    sql: CASE WHEN momentum_band = 'Stable' THEN 1 END
    label: Accounts - Stable
    aggregate_type: count

  accounts_declining:
    sql: CASE WHEN momentum_band = 'Declining' THEN 1 END
    label: Accounts - Declining
    aggregate_type: count

  accounts_at_risk:
    sql: CASE WHEN momentum_band = 'At Risk' THEN 1 END
    label: Accounts - At Risk
    aggregate_type: count
