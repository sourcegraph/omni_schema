# Reference this view as post_sales__customer_momentum_score_latest
label: Momentum Score (Latest)
description: Most recent customer_momentum_score row per account, picked by latest run_date.

sql: |-
  SELECT *
  FROM `telligentsourcegraph.post_sales.customer_momentum_score`
  QUALIFY ROW_NUMBER() OVER (
    PARTITION BY account_id
    ORDER BY run_date DESC
  ) = 1

dimensions:
  # ── Account ────────────────────────────────────────────────────
  account_name: {}
  account_manager: {}
  account_owner: {}
  segmentation: {}
  raw_score: {}
  score_max: {}
  # ── Score levels ───────────────────────────────────────────────
  level_mau: {}
  level_seat_consumption: {}
  level_power_users: {}
  level_feature_breadth: {}
  level_ui_search: {}
  level_ds_users_queries: {}
  level_ds_diversity: {}
  level_ds_consumed: {}
  level_mcp: {}
  level_repo_size: {}
  purchased_seats: {}

  account_id:
    format: ID
    primary_key: true

  sfdc_unique_id:
    format: ID

  # ── Dates ──────────────────────────────────────────────────────
  run_date:
    convert_tz: false

  ds_activated_date:
    convert_tz: false

  # ── Momentum score & band ──────────────────────────────────────
  momentum_score:
    sql: momentum_score / 100
    format: percent_0

  momentum_band:
    sql: |-
      CASE
        WHEN momentum_band = 'Expansion Signal' THEN '🎯 Expansion Signal'
        WHEN momentum_band = 'Accelerating'     THEN '🚀 Accelerating'
        WHEN momentum_band = 'Stable'           THEN '➡️ Stable'
        WHEN momentum_band = 'Declining'        THEN '⚠️ Declining'
        WHEN momentum_band = 'At Risk'          THEN '⛔️ At Risk'
        ELSE momentum_band
      END

  momentum_band_sort:
    sql: |-
      CASE
        WHEN momentum_band = 'Expansion Signal' THEN 1
        WHEN momentum_band = 'Accelerating'     THEN 2
        WHEN momentum_band = 'Stable'           THEN 3
        WHEN momentum_band = 'Declining'        THEN 4
        WHEN momentum_band = 'At Risk'          THEN 5
        ELSE 6
      END
    label: Momentum Band (sort)
    hidden: true

  # ── Band contributions ─────────────────────────────────────────
  dimensions_positive:
    label: Momentum Green Dimensions

  dimensions_stable:
    label: Momentum Yellow Dimensions

  dimensions_negative:
    label: Momentum Red Dimensions

  # ── Score components (points) ──────────────────────────────────
  pts_mau:
    label: Score MAU

  pts_seat_consumption:
    label: Score Seat Consumption

  pts_power_users:
    label: Score Power Users

  pts_feature_breadth:
    label: Score Feature Breadth

  pts_ui_search:
    label: Score UI Searches

  pts_ds_users_queries:
    label: Score DS User/Queries

  pts_ds_diversity:
    label: Score DS Diversity

  pts_ds_consumed:
    label: Score DS Consumed

  pts_mcp:
    label: Score MCP

  pts_repo_size:
    label: Score Repo Size

  # ── Revenue & seats ────────────────────────────────────────────
  iacv:
    label: IACV
    format: usdcurrency_0

  # ── MAU by period ──────────────────────────────────────────────
  mau_p0:
    group_label: MAU

  mau_p1:
    group_label: MAU

  mau_p2:
    group_label: MAU

  mau_p3:
    group_label: MAU

  mau_pct_p0p1:
    format: percent_1
    group_label: MAU

  mau_pct_p1p2:
    format: percent_1
    group_label: MAU

  mau_pct_p2p3:
    format: percent_1
    group_label: MAU

  # ── Seat consumption by period ─────────────────────────────────
