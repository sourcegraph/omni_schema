# Reference this view as telligentsourcegraph_telemetry__v2_events
catalog: telligentsourcegraph
schema: telemetry
table_name: v2_events

dimensions:
  publish_time:
    description: Timestamp of when the event landed in our data-warehouse.

  timestamp:
    description: Timestamp of when the original event was recorded.

  metadata:
    description: Metadata associated with the request to publish this event.
    parent_field: metadata

  metadata_identifier:
    sql: metadata.identifier
    description: |-
      Telemetry publisher self-identification - for example, a Sourcegraph
       instance of some other kind of service.
    parent_field: metadata

  metadata_identifier_licensedinstance:
    sql: metadata.identifier.licensedInstance
    description: A licensed Sourcegraph instance.
    parent_field: metadata

  metadata_identifier_licensedinstance_externalurl:
    sql: metadata.identifier.licensedInstance.externalUrl
    description: Instance external URL defined in the instance site configuration.
    parent_field: metadata

  metadata_identifier_licensedinstance_instanceid:
    sql: metadata.identifier.licensedInstance.instanceId
    description: Self-reported Sourcegraph instance identifier.
    parent_field: metadata

  metadata_identifier_licensedinstance_licensekey:
    sql: metadata.identifier.licensedInstance.licenseKey
    description: License key configured in the Sourcegraph instance emitting the event.
    parent_field: metadata

  metadata_identifier_managedservice:
    sql: metadata.identifier.managedService
    description: |-
      A service operated and managed by the Sourcegraph team, for example
       a service deployed by MSP: https://handbook.sourcegraph.com/departments/engineering/teams/core-services/managed-services/platform/

       Valid SAMS client credentials are required to publish events under a
       managed service identifier. The required scope is
       'telemetry_gateway::events::publish'. See go/sams-client-credentials and
       go/sams-token-scopes for more information.
    parent_field: metadata

  metadata_identifier_managedservice_serviceenvironment:
    sql: metadata.identifier.managedService.serviceEnvironment
    description: Self-reported service environment, for example 'prod' or 'dev'.
    parent_field: metadata

  metadata_identifier_managedservice_serviceid:
    sql: metadata.identifier.managedService.serviceId
    description: Self-reported service identifier, for example 'my-service'.
    parent_field: metadata

  metadata_identifier_unlicensedinstance:
    sql: metadata.identifier.unlicensedInstance
    description: An unlicensed Sourcegraph instance.
    parent_field: metadata

  metadata_identifier_unlicensedinstance_externalurl:
    sql: metadata.identifier.unlicensedInstance.externalUrl
    description: Instance external URL defined in the instance site configuration.
    parent_field: metadata

  metadata_identifier_unlicensedinstance_instanceid:
    sql: metadata.identifier.unlicensedInstance.instanceId
    description: Self-reported Sourcegraph instance identifier.
    parent_field: metadata

  metadata_identifier_workspace:
    sql: metadata.identifier.workspace
    description: A Sourcegraph workspace.
    parent_field: metadata

  metadata_identifier_workspace_externalurl:
    sql: metadata.identifier.workspace.externalUrl
    description: Workspace external URL.
    parent_field: metadata

  metadata_identifier_workspace_workspaceid:
    sql: metadata.identifier.workspace.workspaceId
    description: Workspace identifier.
    parent_field: metadata

  metadata_requestid:
    sql: metadata.requestId
    description: ID associated with the request to publish this event.
    parent_field: metadata

  external_url:
    sql: externalUrl
    description: Instance external URL defined in the instance site configuration.
      Populated from either the licensed or unlicensed instance metadata.
    group_label: Instance Info

  instance_id:
    sql: instanceId
    format: ID
    description: Self-reported Sourcegraph instance identifier. Populated from
      either the licensed or unlicensed instance metadata.
    group_label: Instance Info

  id:
    sql: id
    format: ID
    description: Generated ID of the event, currently expected to be UUID v4.
    primary_key: true

  user_id:
    sql: userId
    label: Instance user ID
    format: number_0
    description: Unique within the instance
    group_label: Instance Info

  anonymous_user_id:
    sql: anonymousUserId
    format: ID
    description: |-
      Randomized unique identifier representing the user (typically stored in
       localstorage in web clients, or similar mechanisms elsewhere). This is
       often used for unauthenticated users, but can persist to authenticated
       users as well.

  sams_external_id:
    sql: samsExternalId
    format: ID
    description: |-
      Sourcegraph Accounts Management System (SAMS) account associated with the
       user, represented by a SAMS external user ID in a UUID format. This is only
       valid for services leveraging SAMS as an identity provider - in other words,
       traditional Sourcegraph instances will not provide this.

       Learn more about SAMS: https://handbook.sourcegraph.com/departments/engineering/teams/core-services/sams

  user_metadata:
    sql: userMetadata
    description: Metadata associated with the user. Populated by data & analytics pipelines
    parent_field: user_metadata

  usermetadata_email:
    sql: userMetadata.email
    description: Primary email address associated with the user
    parent_field: user_metadata

  usermetadata_issourcegraphteammate:
    sql: userMetadata.isSourcegraphTeammate
    description: Indicates whether the user is a Sourcegraph teammate.
    parent_field: user_metadata

  usermetadata_serviceaccount:
    sql: userMetadata.serviceAccount
    description: Indicates whether the user is a service account
    parent_field: user_metadata

  usermetadata_username:
    sql: userMetadata.username
    description: Username associated with the user
    parent_field: user_metadata

  unique_user_id:
    sql: uniqueUserId
    format: ID
    description: Unique across instances

  feature:
    sql: feature
    description: Feature associated with the event in camelCase, e.g. 'myFeature'.
    hidden: true

  action:
    sql: action
    description: Action associated with the event in camelCase, e.g. 'pageView'.
    hidden: true

  event_name:
    sql: eventName
    label: Event Name (feature:action)
    description: Concatenated feature:action, e.g. myFeature:pageView

  server:
    description: |-
      Information about the server that is publishing the event, based on
       RecordEventsRequestMetadata.Identifier.
    parent_field: server

  server_apirequestclient:
    sql: server.apiRequestClient
    description: Information about the client that made an API request.
    parent_field: server

  server_apirequestclient_apiclientfeature:
    sql: server.apiRequestClient.apiClientFeature
    description: Feature of the client that made an API request.
    parent_field: server

  server_apirequestclient_apiclientname:
    sql: server.apiRequestClient.apiClientName
    description: Name of the client that made an API request.
    parent_field: server

  server_apirequestclient_apiclientversion:
    sql: server.apiRequestClient.apiClientVersion
    description: Version of the client that made an API request.
    parent_field: server

  server_apirequestclient_requestedwith:
    sql: server.apiRequestClient.requestedWith
    description: HTTP header identifying the type of client making the API request.
    parent_field: server

  server_apirequestclient_useragent:
    sql: server.apiRequestClient.userAgent
    description: User agent of the client that made an API request.
    parent_field: server

  server_version:
    sql: server.version
    description: |-
      Version of the server emitting the event, corresponding to
       RecordEventsRequestMetadata.Identifier. For example, if the Identifier
       indicates the publisher is a Sourcegraph instance, the version represents
       the version of the Sourcegraph server.
    parent_field: server

  client:
    description: Information about the client that generated the event.
    parent_field: client

  client_name:
    sql: client.name
    description: Source client of the event.
    parent_field: client

  client_version:
    sql: client.version
    description: Version of the client.
    parent_field: client

  client_versionmajor:
    sql: client.versionMajor
    description: Major version of the client.
    parent_field: client

  client_versionminor:
    sql: client.versionMinor
    description: Minor version of the client.
    parent_field: client

  client_versionnormalized:
    sql: client.versionNormalized
    description: Normalized version of the client, in the format left-padded
      'major.minor.patch'.
    parent_field: client

  client_versionpatch:
    sql: client.versionPatch
    description: Patch version of the client.
    parent_field: client

  client_and_service_id:
    sql: clientAndServiceId
    format: ID
    description: Concatenated serviceId + client, e.g. cody-analytics:web

  parameters:
    description: Parameters of the event.
    parent_field: parameters

  parameters_billingmetadata:
    sql: parameters.billingMetadata
    description: Optional billing-related metadata.
    parent_field: parameters

  parameters_billingmetadata_category:
    sql: parameters.billingMetadata.category
    description: Billing category ID the event falls into.
    parent_field: parameters

  parameters_billingmetadata_product:
    sql: parameters.billingMetadata.product
    description: Billing product ID associated with the event.
    parent_field: parameters

  parameters_legacymetadata:
    sql: parameters.legacyMetadata
    description: |-
      DEPRECATED, legacy metadata format that only accepted int64 - use the new
       'metadata' field instead, which accepts float values. Values sent through
       this proto field will be merged into the new metadata attributes.

       We don't use a [deprecated = true] tag because we use this field to handle
       accepting exporters sending metadata in this format.
    parent_field: parameters

  parameters_metadata:
    sql: to_json_string(parameters.metadata)
    description: |-
      Strictly typed metadata, restricted to integer values to avoid accidentally
       exporting sensitive or private data.
    parent_field: parameters

  parameters_privatemetadata:
    sql: parameters.privateMetadata
    description: |-
      Additional potentially sensitive metadata - i.e. not restricted to integer
       values.

       🚨 SECURITY: This metadata is NOT exported from instances by default, as it
       can contain arbitrarily-shaped data that may accidentally contain sensitive
       or private contents.

       This metadata is only exported on an allowlist basis based on terms of
       use agreements and combinations of event feature and action, alongside
       careful audit of callsites.
    parent_field: parameters

  parameters_version:
    sql: parameters.version
    description: |-
      Version of the event parameters, used for indicating the "shape" of this
       event's metadata, beginning at 0. Useful for denoting if the shape of
       metadata has changed in any way.
    parent_field: parameters

  feature_flags:
    sql: json_extract_scalar(featureFlags, '$.flags')
    description: Optional feature flags configured in the context of the event.
    parent_field: feature_flags

  featureflags_flags:
    sql: featureFlags.flags
    description: |-
      Evaluated feature flags. In Soucegraph we currently only support boolean
       feature flags, but in the API we allow arbitrary string values for future
       extensibility.

       This field should be hydrated by the Sourcegraph server, and not provided
       by clients.
    parent_field: feature_flags

  marketing_tracking:
    sql: marketingTracking
    description: |-
      Optional marketing campaign tracking parameters.

       🚨 SECURITY: This metadata is NEVER exported from single-tenant Sourcegraph
       instances, and is only exported for events tracked in the public
       Sourcegraph.com instance and managed services.
    parent_field: marketing_tracking

  marketingtracking_cohortid:
    sql: marketingTracking.cohortId
    description: Cohort ID to identify the user as part of a specific A/B test.
    parent_field: marketing_tracking

  marketingtracking_devicesessionid:
    sql: marketingTracking.deviceSessionId
    description: Device session ID to identify the user's session.
    parent_field: marketing_tracking

  marketingtracking_firstpageseenurl:
    sql: marketingTracking.firstPageSeenUrl
    description: First URL the user visited in their current session.
    parent_field: marketing_tracking

  marketingtracking_firstsourceurl:
    sql: marketingTracking.firstSourceUrl
    description: Initial URL the user landed on.
    parent_field: marketing_tracking

  marketingtracking_lastpageseenurl:
    sql: marketingTracking.lastPageSeenUrl
    description: Last page seen URL by the user.
    parent_field: marketing_tracking

  marketingtracking_lastsourceurl:
    sql: marketingTracking.lastSourceUrl
    description: Last source URL visited by the user.
    parent_field: marketing_tracking

  marketingtracking_mostrecentreferrer:
    sql: marketingTracking.mostRecentReferrer
    description: Most recent refferer URL.
    parent_field: marketing_tracking

  marketingtracking_referrer:
    sql: marketingTracking.referrer
    description: Referrer URL that refers the user to Sourcegraph.
    parent_field: marketing_tracking

  marketingtracking_sessionfirsturl:
    sql: marketingTracking.sessionFirstUrl
    description: First URL the user visited in their current session.
    parent_field: marketing_tracking

  marketingtracking_sessionreferrer:
    sql: marketingTracking.sessionReferrer
    description: Session referrer URL for the user.
    parent_field: marketing_tracking

  marketingtracking_url:
    sql: marketingTracking.url
    description: URL the event occurred on.
    parent_field: marketing_tracking

  marketingtracking_utmcampaign:
    sql: marketingTracking.utmCampaign
    description: UTM campaign parameter.
    parent_field: marketing_tracking

  marketingtracking_utmcontent:
    sql: marketingTracking.utmContent
    description: UTM content parameter.
    parent_field: marketing_tracking

  marketingtracking_utmmedium:
    sql: marketingTracking.utmMedium
    description: UTM medium parameter.
    parent_field: marketing_tracking

  marketingtracking_utmsource:
    sql: marketingTracking.utmSource
    description: UTM source parameter.
    parent_field: marketing_tracking

  marketingtracking_utmterm:
    sql: marketingTracking.utmTerm
    description: UTM term parameter.
    parent_field: marketing_tracking

  interaction:
    description: Optional metadata identifying the interaction that generated the event.
    parent_field: interaction

  interaction_geolocation:
    sql: interaction.geolocation
    description: |-
      Geolocation associated with the interaction, typically inferred from the
       originating client's IP address (which we do not collect).
    parent_field: interaction

  interaction_geolocation_countrycode:
    sql: interaction.geolocation.countryCode
    description: Inferred ISO 3166-1 alpha-2 or alpha-3 country code
    parent_field: interaction

  interaction_interactionid:
    sql: interaction.interactionId
    description: Custom interaction ID representing the interaction associated with
      the event.
    parent_field: interaction

  interaction_sessionid:
    sql: interaction.sessionId
    description: Session identifier for correlating related search telemetry events
      within a single session.
    parent_field: interaction

  interaction_traceid:
    sql: interaction.traceId
    description: OpenTelemetry trace ID representing the interaction associated with
      the event.
    parent_field: interaction

  dau_lookup:
    sql: dauLookup
    description: DAU classification of each event per product. Populated by data &
      analytics pipelines
    parent_field: dau_lookup

  daulookup_billingdau:
    sql: dauLookup.billingDau
    description: A billing DAU represents a user who interacts with the product,
      regardless of intention and result.
    parent_field: dau_lookup

  daulookup_billingevent:
    sql: dauLookup.billingEvent
    description: A billable Cody user is defined as someone who is signed into their
      Enterprise Sourcegraph account and actively engages with Cody through
      various interactions, such as receiving autocompletions, running commands,
      chatting, or adjusting settings. Similarly, a billable active Code Search
      or Code Intelligence Platform user is one who signs into and accesses
      Sourcegraph.
    parent_field: dau_lookup

  daulookup_eventcategory:
    sql: dauLookup.eventCategory
    description: Product category of the event, e.g. 'Cody', 'Search', 'Code Insights'.
    parent_field: dau_lookup

  daulookup_product:
    sql: dauLookup.product
    description: The product or SKU that the event can be primarily attributed to.
      e.g. 'Cody', 'Search', 'Code Insights'.
    parent_field: dau_lookup

  license_key:
    sql: metadata.identifier.licensedInstance.licenseKey
    group_label: Instance Info

  parameters_private_metadata:
    sql: to_json_string(parameters.privateMetadata)

  source_client_name:
    sql: client.name
    label: Client Name
    group_label: Client Info

  source_client_version:
    sql: client.version
    label: Client Version
    group_label: Client Info

  source_client_version_normalized:
    sql: CAST(client.versionNormalized as NUMERIC)
    label: Client Version Normalized
    group_label: Client Info

  source_server_version:
    sql: server.version
    label: Server Version

  biweekly_period:
    sql: |-
      CASE
            WHEN timestamp IS NOT NULL THEN
              DATE_TRUNC(DATE_ADD(timestamp, INTERVAL -MOD(EXTRACT(DAYOFYEAR FROM timestamp) - 1, 14) DAY), DAY)
            ELSE NULL
          END
    group_label: Timestamp Period

  sams_external_user_id:
    sql: samsExternalId
    description: SAMS user ID

  marketing_tracking_url:
    sql: marketingTracking.url
    group_label: Marketing tracking

  marketing_tracking_url_without_params:
    sql: REGEXP_EXTRACT(marketingTracking.url, r'^[^?@]+')
    group_label: Marketing tracking

  marketing_tracking_first_source_url:
    sql: marketingTracking.firstSourceUrl
    group_label: Marketing tracking

  marketing_tracking_cohort_id:
    sql: marketingTracking.cohortId
    group_label: Marketing tracking

  marketing_tracking_first_source_url_without_params:
    sql: REGEXP_EXTRACT(marketingTracking.firstSourceUrl, r'^[^?@]+')
    group_label: Marketing tracking

  marketing_tracking_referrer:
    sql: marketingTracking.referrer
    group_label: Marketing tracking

  marketing_tracking_referrer_without_params:
    sql: REGEXP_EXTRACT(marketingTracking.referrer, r'^[^?@]+')
    group_label: Marketing tracking

  marketing_tracking_lastsourceurl:
    sql: marketingTracking.lastSourceUrl
    group_label: Marketing tracking

  marketing_tracking_last_source_url_without_params:
    sql: REGEXP_EXTRACT(marketingTracking.lastSourceUrl, r'^[^?@]+')
    group_label: Marketing tracking

  marketing_tracking_device_session_id:
    sql: marketingTracking.deviceSessionId
    group_label: Marketing tracking

  marketing_tracking_session_referrer:
    sql: marketingTracking.sessionReferrer
    group_label: Marketing tracking

  marketing_tracking_session_referrer_without_params:
    sql: REGEXP_EXTRACT(marketingTracking.sessionReferrer, r'^[^?@]+')
    group_label: Marketing tracking

  marketing_tracking_session_referrer_utm_campaign:
    sql: regexp_extract(marketingTracking.sessionReferrer, r"utm_campaign=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_referrer_utm_medium:
    sql: regexp_extract(marketingTracking.sessionReferrer, r"utm_medium=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_referrer_utm_source:
    sql: regexp_extract(marketingTracking.sessionReferrer, r"utm_source=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_referrer_utm_content:
    sql: regexp_extract(marketingTracking.sessionReferrer, r"utm_content=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_referrer_utm_term:
    sql: regexp_extract(marketingTracking.sessionReferrer, r"utm_term=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_first_url:
    sql: marketingTracking.sessionFirstUrl
    group_label: Marketing tracking

  marketing_tracking_session_first_url_without_params:
    sql: REGEXP_EXTRACT(marketingTracking.sessionFirstUrl, r'^[^?@]+')
    group_label: Marketing tracking

  marketing_tracking_session_first_url_utm_campaign:
    sql: regexp_extract(marketingTracking.sessionFirstUrl, r"utm_campaign=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_first_url_utm_medium:
    sql: regexp_extract(marketingTracking.sessionFirstUrl, r"utm_medium=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_first_url_utm_source:
    sql: regexp_extract(marketingTracking.sessionFirstUrl, r"utm_source=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_first_url_utm_content:
    sql: regexp_extract(marketingTracking.sessionFirstUrl, r"utm_content=([^&]*)")
    group_label: Marketing tracking

  marketing_tracking_session_first_url_utm_term:
    sql: regexp_extract(marketingTracking.sessionFirstUrl, r"utm_term=([^&]*)")
    group_label: Marketing tracking

  interaction_trace_id:
    sql: interaction.traceId

  interaction_geolocation_country_code:
    sql: interaction.geolocation.countryCode
    label: Country Code
    group_label: Geo Location

  email:
    sql: userMetadata.email
    label: Dotcom email
    group_label: Dotcom Info

  username:
    sql: userMetadata.username
    label: Dotcom username
    group_label: Dotcom Info

  is_sourcegraph_teammate:
    sql: userMetadata.isSourcegraphTeammate

  day_of_week:
    sql: EXTRACT(DAYOFWEEK FROM timestamp)

  day_of_week_name:
    sql: CASE WHEN ${day_of_week} = 1 THEN 'Sunday' WHEN ${day_of_week} = 2 THEN
      'Monday' WHEN ${day_of_week} = 3 THEN 'Tuesday' WHEN ${day_of_week} = 4
      THEN 'Wednesday' WHEN ${day_of_week} = 5 THEN 'Thursday' WHEN
      ${day_of_week} = 6 THEN 'Friday' WHEN ${day_of_week} = 7 THEN 'Saturday'
      ELSE 'Other' END
    label: Day of Week
    group_label: Timestamp Period

  language:
    sql: JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.languageId')
    label: Language Id

  model:
    sql: JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.model')
    label: Model (command, fixup,autoedit)
    group_label: LLM Model

  diagnostics:
    sql: "CONCAT('code: ',JSON_EXTRACT_SCALAR(parameters.privateMetadata,
      '$.diagnostics.0.code'), ', source: ',
      JSON_EXTRACT_SCALAR(parameters.privateMetadata,
      '$.diagnostics.0.source'))"
    group_label: Mode/Intent/Diagnostics

  new_user_saved:
    sql: json_extract_scalar(parameters.metadata, '$.newUserSaved')

  source_private_metadata:
    sql: JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.source')
    label: Source - from Private Metadata
    description: The source field in the parameter event privateMetadata. This field
      means different things for completion events than it does for command
      events, so be careful!
    group_label: Source

  search_latency_top3_dimension:
    sql: |-
      CASE WHEN (${event_name} = "search.latencies:structural" OR
                    ${event_name} = "search.latencies:regexp" OR
                    ${event_name} = "search.latencies:regex" OR ${event_name} = "search.latencies:literal" OR ${event_name} = "search.latencies:keyword"
                      ) THEN CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS INT64) ELSE
                    null END
    label: Search Latency Structural, Literal, Regexp
    description: Search Latency Structural, Literal, Regexp (derived from parameters
      metadata).
    hidden: true

  provideridentifier:
    sql: JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.providerIdentifier')
    group_label: LLM Model

  resolvedmodel:
    sql: JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.resolvedModel')
    group_label: Completion Info

  ide_product_breakdown:
    sql: CASE WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') =
      "1" THEN 'IntelliJ IDEA Ultimate' WHEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') = "2" THEN
      'IntelliJ IDEA Community' WHEN JSON_EXTRACT_SCALAR(parameters.metadata,
      '$.ideProductCode') = "3" THEN 'IntelliJ IDEA Educational' WHEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') = "4" THEN
      'PhpStorm' WHEN JSON_EXTRACT_SCALAR(parameters.metadata,
      '$.ideProductCode') = "5" THEN 'WebStorm' WHEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') = "6" THEN
      'PyCharm Professional' WHEN JSON_EXTRACT_SCALAR(parameters.metadata,
      '$.ideProductCode') = "7" THEN 'PyCharm Community' WHEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') = "8" THEN
      'PyCharm Educational' WHEN JSON_EXTRACT_SCALAR(parameters.metadata,
      '$.ideProductCode') = "9" THEN 'RubyMine' WHEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') = "10" THEN
      'AppCode' WHEN JSON_EXTRACT_SCALAR(parameters.metadata,
      '$.ideProductCode') = "11" THEN 'CLion' WHEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') = "12" THEN
      'GoLand' WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode')
      = "13" THEN 'DataGrip' WHEN JSON_EXTRACT_SCALAR(parameters.metadata,
      '$.ideProductCode') = "14" THEN 'Rider' WHEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideProductCode') = "15" THEN
      'Android Studio' ELSE 'null' END
    description: JetBrains IDE products e.g. GoLand, Pycharm, etc
    group_label: IDE Info

  ide_baseline_version:
    sql: JSON_EXTRACT_SCALAR(parameters.metadata, '$.ideBaselineVersion')
    group_label: IDE Info

  hour_of_day:
    sql: EXTRACT(HOUR FROM timestamp)

  client_side_model:
    sql: |-
      CASE
                  WHEN CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.multiline') AS INT64) = 1 then 'starcoder-16b'
                  WHEN CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.multiline') AS INT64) = 0 then 'starcoder-7b'
                END
    group_label: Client Info

  region:
    sql: |-
      CASE
                  WHEN ${interaction_geolocation_country_code} IN ('IN', 'PK', 'ID', 'VN', 'IL', 'BD', 'IR', 'PH', 'TR', 'CN', 'JP', 'KR', 'SG', 'TH', 'GR', 'NP', 'LK', 'AU', 'NZ') THEN 'Asia'
                  WHEN ${interaction_geolocation_country_code} IN ('US', 'CA','MX') THEN 'North America'
                  WHEN ${interaction_geolocation_country_code} IN ('GB', 'DE', 'FR', 'IT', 'ES', 'PT', 'NL', 'PL', 'UA', 'SE', 'BE', 'RO', 'CZ', 'BY', 'AT', 'FI', 'RS', 'CH', 'RU', 'DK','IE','BG') THEN 'Europe'
                  WHEN ${interaction_geolocation_country_code} IN ('BR', 'AR', 'CO', 'CL','UY') THEN 'South America'
                  WHEN ${interaction_geolocation_country_code} IN ('NG', 'EG', 'ZA', 'MA', 'TN', 'KE', 'GH', 'DZ') THEN 'Africa'
                  ELSE 'Unknown'
                END
    group_label: Geo Location

  code_intel_actions:
    sql: |-
      CASE
                  -- Combine event-based action types
                  WHEN ${event_name} IN ('blob.codeintel:searchHover',
                  'blob.codeintel:searchDefinitions',
                  'blob.codeintel:searchDocumentHighlight')
                  OR (${event_name} like "codeintel%" AND  JSON_EXTRACT_SCALAR(parameters.metadata, '$.provenance') = '1')
                  THEN 'Search-based'
                  WHEN ${event_name} IN ('blob.codeintel:lsifHover',
                  'blob.codeintel:lsifDefinitions',
                  'blob.codeintel:lsifDocumentHighlight')
                  OR (${event_name} like "codeintel%" AND  JSON_EXTRACT_SCALAR(parameters.metadata, '$.provenance') = '2')
                  THEN 'Precise'

              WHEN (${event_name} like "codeintel%" AND  JSON_EXTRACT_SCALAR(parameters.metadata, '$.provenance') = '3')
              THEN 'Syntactic'
              END
    label: Code Intel Provenance Combined (precise/search/syntactic)
    group_label: Search Code Nav

  source_metadata:
    sql: CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.source') AS INT64)
    label: Source - from metadata
    description: The numeric source value from the metadata for
      cody.fixup.persistence:present events.
    group_label: Source

