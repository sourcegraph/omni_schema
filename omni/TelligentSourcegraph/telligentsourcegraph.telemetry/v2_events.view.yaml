  direct_search_count:
    sql: |-
      CASE
                    WHEN ${event_name} = "search:execute" AND (
                      (SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) IN (6,8))
                      OR
                      (SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 2 AND
                       ${api_client_name} IS NULL)
                      OR
                      (SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 1 AND
                      ${api_client_feature} IS NOT NULL)
                      )
                    THEN 1
                    ELSE 0
                  END
    group_label: Search Execute Metadata
    description: Count of direct searches (API Stream, Search Jobs, Code Monitors,
      or GraphQL Query with null API client)
    aggregate_type: sum

  indirect_search_count:
    sql: |-
      CASE
                    WHEN ${event_name} = "search:execute" AND (
                      (SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) IN (3,4,5,7,9))
                      OR
                      (SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 2 AND
                       ${api_client_name} = "web")
                      OR
                      (SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 1 AND
                       ${api_client_feature} IS NULL)
                      )
                    THEN 1
                    ELSE 0
                  END
    group_label: Search Execute Metadata
    description: Count of indirect searches (API Compute, Cody Context API,
      Guardrails API, Code Intel, Code Insights, or GraphQL Query with 'web' API
      client)
    aggregate_type: sum

