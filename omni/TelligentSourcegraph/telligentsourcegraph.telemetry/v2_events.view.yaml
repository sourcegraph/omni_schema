    group_label: Search Execute Metadata

  search_language:
    sql: JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.lang')
    label: Language - Search Executed
    group_label: Search Execute Metadata

  search_type:
    sql: |-
      CASE
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.type') AS INT64) = 1 THEN 'Repo'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.type') AS INT64) = 2 THEN 'File'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.type') AS INT64) = 3 THEN 'Path'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.type') AS INT64) = 4 THEN 'Commit'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.type') AS INT64) = 5 THEN 'Diff'
              WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.type') AS INT64) = 6 THEN 'Symbol'
              WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.type') AS INT64) = 0 THEN 'Other'
             END
    description: Search Type
    group_label: Search Execute Metadata

  search_pattern_type:
    sql: |-
      CASE
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.patterntype') AS INT64) = 1 THEN 'Standard'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.patterntype') AS INT64) = 2 THEN 'Regex'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.patterntype') AS INT64) = 3 THEN 'Literal'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.patterntype') AS INT64) = 4 THEN 'Structural'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.patterntype') AS INT64) = 5 THEN 'CodyContext'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.patterntype') AS INT64) = 6 THEN 'Keyword'
               WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.patterntype') AS INT64) = 7 THEN 'Natural Language Search (NLS)'
             END
    description: Search Pattern Type
    group_label: Search Execute Metadata

  code_intel_provenance:
    sql: |-
      CASE
               WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.provenance') = '1' THEN 'Search-based'
               WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.provenance') = '2' THEN 'Precise'
               WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.provenance') = '3' THEN 'Syntactic'
             END
    label: Code Intel Provenance (search/precise/syntactic)
    group_label: Search Code Nav

  code_intel_explore_tab:
    sql: |-
      CASE
               WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.codeintel_tabType') = '1' THEN 'Search-based'
               WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.codeintel_tabType') = '2' THEN 'Precise'
             END
    label: Code Intel Explore Tab Click (precise/search)
    group_label: Search Code Nav

  client_version_truncated:
    sql: SAFE_CAST(LEFT(${source_client_version}, 4) as FLOAT64)
    description: First 4 characters of the client version

  marketing_tracking_utmsource:
    sql: marketingTracking.utmSource
    label: UTM Source
    group_label: Marketing Tracking New

  marketing_tracking_utmmedium:
    sql: marketingTracking.utmMedium
    label: UTM Medium
    group_label: Marketing Tracking New

  marketing_tracking_utmcampaign:
    sql: marketingTracking.utmCampaign
    label: UTM Campaign
    group_label: Marketing Tracking New

  marketing_tracking_utmcontent:
    sql: marketingTracking.utmContent
    label: UTM Content
    group_label: Marketing Tracking New

  marketing_tracking_utmterm:
    sql: marketingTracking.utmTerm
    label: UTM Term
    group_label: Marketing Tracking New

  marketing_tracking_most_recent_referrer:
