  search_filter_kind:
    sql: |-
      CASE
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '1' THEN 'By File'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '2' THEN 'By Repo'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '3' THEN 'By Language'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '4' THEN 'By Utility'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '5' THEN 'By Author'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '6' THEN 'By Commit Date'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '7' THEN 'By Symbol Type'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '8' THEN 'By Type'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '9' THEN 'By Snippet'
               WHEN ${event_name} = "search.filters:select" AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.filterKind') = '10' THEN 'By Count'
             END
    label: Search Filter Select Type
    group_label: Search Execute Metadata

  billing_metadata_category:
