    group_label: Marketing Tracking New

  code_intel_language_combined:
    sql: |-
      CASE
                WHEN ${event_name} LIKE 'blob.codeintel%'
                  THEN LOWER(json_extract_scalar(parameters.privateMetadata, '$.languageId'))
                WHEN ${event_name} LIKE "codeintel%"
                  THEN LOWER(JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.lang'))
                ELSE NULL
                END
    group_label: Search Code Nav

  search_result_context_total:
    sql: cast(json_extract_scalar(parameters.metadata,"$['context.byOpenctxProvider.internal-code-search-provider.size.total']")
      as INT64)

  agent_has_error:
    sql: CASE WHEN ${event_name} = "%agent%" THEN
      JSON_EXTRACT_SCALAR(parameters.metadata, '$.hasError') ELSE NULL END
    group_label: Review Agent

  model_filter:
    sql: |-
      CONCAT(
                  IFNULL(JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.chatModel'), ''),
                  ' ',
                  IFNULL(JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.providerModel'), ''),
                  ' ',
                  IFNULL(JSON_EXTRACT_SCALAR(parameters.privateMetadata, '$.model'), '')
                )
    label: Model Filter (All Types)
    description: Use for filtering across all model types
    group_label: LLM Model

  api_client_name:
    sql: server.apiRequestClient.apiClientName
    group_label: Server API Client
    hidden: true

  api_client_version:
    sql: server.apiRequestClient.apiClientVersion
    group_label: Server API Client

  api_client_feature:
    sql: server.apiRequestClient.apiClientFeature
    group_label: Server API Client

  search_execute_source:
    sql: |-
      CASE
                         WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 1 THEN 'API Stream'
                         WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 2 THEN 'Search GraphQL Query'
                         WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 3 THEN 'API Compute'
                         WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 4 THEN 'Cody Context API'
                         WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 5 THEN 'Guardrails API'
                         WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 6 THEN 'Search Jobs'
                         WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 7 THEN 'Code Intel'
                        WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 8 THEN 'Code Monitors'
                        WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 9 THEN 'Code Insights'
                        WHEN ${event_name} = "search:execute" AND SAFE_CAST(json_extract_scalar(parameters.metadata, '$.searchSource') AS INT64) = 0 THEN 'Unknown'
                       END
    description: Search Source
    group_label: Search Execute Metadata

  client_version_numeric:
    sql: SAFE_CAST(REPLACE(client.version, '.', '') AS INT64)
    description: Converts IDE client version numbers in to an integer that can be
      filtered on

  dim_deepsearch_turn_count:
    sql: CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.turnCount') as INT64)
    group_label: Deep Search

  toolcall_category:
    sql: |-
      CASE
                WHEN ${event_name} = 'deepsearch:search.toolcall' THEN
                  CASE
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "0" THEN 'Anonymous'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "1" THEN 'Read File'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "2" THEN 'Find References'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "3" THEN 'List Files'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "4" THEN 'List Repos'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "5" THEN 'Keyword Search'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "6" THEN 'NLS Search'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "7" THEN 'Mermaid'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "8" THEN 'Go To Definition'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "9" THEN 'Commit Search'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "10" THEN 'Diff Search'
                    WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') = "11" THEN 'Get Contributor Repos'
                    ELSE 'Other'
                  END
                ELSE NULL
              END
    group_label: Deep Search

  deepsearch_thread_id:
    sql: |-
      CASE
                WHEN ${event_name} = 'deepsearch:search.completed' THEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.id') END
    label: Thread Id
    group_label: Deep Search

  cody_api_internal_external_call:
    sql: |-
      CASE
                    WHEN lower(${cody_api_user_agent}) LIKE '%vscode%'
                      OR lower(${cody_api_user_agent}) LIKE '%jetbrains%'
                      OR lower(${cody_api_user_agent}) LIKE '%neovim%'
                      OR lower(${cody_api_user_agent}) LIKE '%emacs%'
                      OR lower(${cody_api_user_agent}) LIKE '%cody-cli%'
                      OR lower(${cody_api_user_agent}) LIKE '%eclipse%'
                      OR lower(${cody_api_client_name}) IN ('vscode', 'jetbrains', 'sourcegraph', 'cody', 'eclipse')
                    THEN 'Internal'
                    WHEN lower(${cody_api_user_agent}) LIKE '%curl%'
                      OR lower(${cody_api_user_agent}) LIKE '%postman%'
                      OR lower(${cody_api_user_agent}) LIKE '%python%'
                      OR lower(${cody_api_user_agent}) LIKE '%http%'
                      OR lower(${cody_api_client_name}) LIKE '%api%'
                      OR lower(${cody_api_client_name}) LIKE '%script%'
                      OR ${cody_api_client_name} IS NULL
                    THEN 'External'
                    ELSE 'External'
                    END
    label: Internal External Call
    group_label: Server API Client

  external_service_type:
    sql: |-
      CASE
          WHEN json_extract_scalar(parameters.metadata, '$.externalServiceType') = '1' THEN 'Github'
          WHEN json_extract_scalar(parameters.metadata, '$.externalServiceType') = '2' THEN 'GitLab'
          ELSE "other" END

  deep_search_failed_open:
    sql: COALESCE(CAST(JSON_VALUE(parameters.metadata.failedOpen) AS STRING), '0')
    group_label: Deep Search

  metering_sku:
    sql: CAST(JSON_VALUE(parameters.metadata, '$.sku') AS INT64)
    group_label: Deep Search

  deepsearch_consumed_filter:
    sql: |
      (${event_name} IN ('licensing:consumeDeepSearchQuotaClientTiming', 'licensing:consumeDeepSearchQuota')
        AND ${deep_search_failed_open} = '0')
      OR
      (${event_name} = 'metering:consume'
        AND ${metering_sku} = 1)
    hidden: true
    # ── Shared helper (used by several measures below) ─────────────

  service_account:
    sql: COALESCE(userMetadata.serviceAccount, FALSE)
    description: Service account flag, defaults FALSE when null

  # ── Deep Search ───────────────────────────────────────────────
  deepsearch_api_source:
    sql: server.apiRequestClient.requestedWith
    label: Source (Requested With Header)
    group_label: Deep Search

  deepsearch_api_source_type:
    sql: |-
      CASE
        WHEN server.apiRequestClient.requestedWith LIKE '%mcp%' THEN 'MCP'
        WHEN REGEXP_CONTAINS(server.apiRequestClient.requestedWith, r'^sourcegraph\ \d+\.') THEN 'UI'
        WHEN LOWER(server.apiRequestClient.requestedWith) = 'sourcegraph' THEN 'UI'
        WHEN server.apiRequestClient.requestedWith IS NULL THEN NULL
        ELSE 'External'
      END
    label: Source Type (Requested With Header)
    group_label: Deep Search

  api_endpoint:
    sql: |-
      CASE
        WHEN ${event_name} = 'deepsearch:search.externalclient' THEN
          CASE JSON_EXTRACT_SCALAR(parameters.metadata, '$.endpoint')
            WHEN '1' THEN 'Get Conversation'
            WHEN '2' THEN 'List Conversations'
            WHEN '3' THEN 'Create Conversation'
            WHEN '4' THEN 'Delete Conversation'
            WHEN '5' THEN 'Delete All Conversations'
            WHEN '6' THEN 'Rotate Read Token'
            WHEN '7' THEN 'Create Question'
            WHEN '8' THEN 'Cancel Question'
            ELSE 'Other'
          END
        ELSE NULL
      END
    group_label: Deep Search

  entry_point_deep_search:
    sql: |-
      CASE
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.entryPoint') = '1' THEN 'Main'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.entryPoint') = '2' THEN 'Sidebar'
        ELSE 'N/A'
      END
    group_label: Deep Search

  has_source_reference:
    sql: |-
      CASE
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.hasSourceReference') = '1' THEN TRUE
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.hasSourceReference') = '0' THEN FALSE
        ELSE NULL
      END
    group_label: Deep Search

  ds_duration:
    sql: |-
      CASE
        WHEN ${event_name} = 'deepsearch:search.completed'
        THEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs')
      END
    label: Latency in seconds
    group_label: Deep Search

  # Reusable toolCallId → label mapping (shared by DS + MCP)
  toolcall_category_mapping:
    sql: |-
      CASE JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId')
        WHEN '0' THEN 'Anonymous'
        WHEN '1' THEN 'Read File'
        WHEN '2' THEN 'Find References'
        WHEN '3' THEN 'List Files'
        WHEN '4' THEN 'List Repos'
        WHEN '5' THEN 'Keyword Search'
        WHEN '6' THEN 'NLS Search'
        WHEN '7' THEN 'Mermaid'
        WHEN '8' THEN 'Go To Definition'
        WHEN '9' THEN 'Commit Search'
        WHEN '10' THEN 'Diff Search'
        WHEN '11' THEN 'Get Contributor Repos'
        WHEN '12' THEN 'Compare Revisions'
        WHEN '13' THEN 'Raw LLM Summary'
        WHEN '14' THEN 'Raw LLM FollowUp'
        WHEN '15' THEN 'Raw LLM Title'
        WHEN '16' THEN 'Deep Search'
        WHEN '17' THEN 'Deep Search Read'
        WHEN '18' THEN 'Finder'
        WHEN '19' THEN 'Tools List'
        WHEN '20' THEN 'List Refs'
        WHEN '21' THEN 'Check Ancestry'
        WHEN '22' THEN 'Evaluator'
        WHEN '23' THEN 'Load Skill'
        WHEN '100' THEN 'Open Source Research'
        WHEN '101' THEN 'Open Source Research Keyword Search/Read File (Shared ID)'
        WHEN '200' THEN 'Edit Evergreen Document'
        ELSE JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId')
      END
    hidden: true

  tool_call_category:
    sql: |-
      CASE
        WHEN ${event_name} IN ('search:mcp.toolcall', 'deepsearch:search.toolcall')
        THEN ${toolcall_category_mapping}
        ELSE NULL
      END
    label: Tool Call Category (DS&MCP)

  # ── DS Categorization ─────────────────────────────────────────
  category_primary_intent:
    sql: |-
      CASE
        WHEN ${event_name} != 'deepsearch:search.categorized' THEN NULL
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '1' THEN 'Understanding'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '2' THEN 'Finding'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '3' THEN 'Debugging'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '4' THEN 'Comparing'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '5' THEN 'History'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '6' THEN 'Security'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '7' THEN 'Onboarding'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '8' THEN 'Migration'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '9' THEN 'Performance'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '10' THEN 'Dependency'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '11' THEN 'Architecture'
        WHEN JSON_VALUE(parameters.metadata, '$.primaryIntent') = '12' THEN 'Configuration'
        ELSE JSON_VALUE(parameters.metadata, '$.primaryIntent')
      END
    group_label: DS Categorization

  category_secondary_intent:
    sql: |-
      CASE
        WHEN ${event_name} != 'deepsearch:search.categorized' THEN NULL
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '1' THEN 'Understanding'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '2' THEN 'Finding'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '3' THEN 'Debugging'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '4' THEN 'Comparing'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '5' THEN 'History'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '6' THEN 'Security'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '7' THEN 'Onboarding'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '8' THEN 'Migration'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '9' THEN 'Performance'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '10' THEN 'Dependency'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '11' THEN 'Architecture'
        WHEN JSON_VALUE(parameters.metadata, '$.secondaryIntent') = '12' THEN 'Configuration'
        ELSE JSON_VALUE(parameters.metadata, '$.secondaryIntent')
      END
    group_label: DS Categorization

  ds_category_combined_intent:
    sql: CONCAT(${category_primary_intent}, '-', ${category_secondary_intent})
    group_label: DS Categorization

  ds_category_combined_intent_unique:
    sql: |-
      CASE
        WHEN ${category_primary_intent} <= ${category_secondary_intent}
          THEN CONCAT(${category_primary_intent}, ' - ', ${category_secondary_intent})
        ELSE CONCAT(${category_secondary_intent}, ' - ', ${category_primary_intent})
      END
    group_label: DS Categorization

  ds_topics:
    sql: |-
      CASE
        WHEN ${event_name} = 'deepsearch:search.categorized'
        THEN ARRAY_TO_STRING(JSON_VALUE_ARRAY(parameters.privateMetadata, '$.topics'), ', ')
      END
    label: Topics
    description: Topics array from privateMetadata on deepsearch:search.categorized
      events, comma-separated
    group_label: DS Categorization

  ds_topic_count:
    sql: |-
      CASE
        WHEN ${event_name} = 'deepsearch:search.categorized'
        THEN ARRAY_LENGTH(JSON_VALUE_ARRAY(parameters.privateMetadata, '$.topics'))
      END
    label: Topic Count
    group_label: DS Categorization

  # ── ABC Categorization ─────────────────────────────────────────
  abc_category_primary_intent:
    sql: |-
      CASE
        WHEN ${event_name} != 'batchChangeAgent:categorization' THEN NULL
        ELSE
          CASE JSON_VALUE(parameters.metadata, '$.primaryIntent')
            WHEN '0' THEN 'None'
            WHEN '1' THEN 'Dependency Change'
            WHEN '2' THEN 'API Migration'
            WHEN '3' THEN 'Bug Fix'
            WHEN '4' THEN 'Feature'
            WHEN '5' THEN 'Refactor'
            WHEN '6' THEN 'Security'
            WHEN '7' THEN 'Testing'
            WHEN '8' THEN 'CI/CD'
            WHEN '9' THEN 'Configuration'
            WHEN '10' THEN 'Documentation'
            WHEN '11' THEN 'Code Quality'
            WHEN '12' THEN 'Performance'
            WHEN '13' THEN 'Observability'
            WHEN '14' THEN 'Compliance'
            WHEN '15' THEN 'Other'
            ELSE JSON_VALUE(parameters.metadata, '$.primaryIntent')
          END
      END
    label: ABC Primary Intent
    group_label: ABC Categorization

  abc_category_secondary_intent:
    sql: |-
      CASE
        WHEN ${event_name} != 'batchChangeAgent:categorization' THEN NULL
        ELSE
          CASE JSON_VALUE(parameters.metadata, '$.secondaryIntent')
            WHEN '0' THEN 'None'
            WHEN '1' THEN 'Dependency Change'
            WHEN '2' THEN 'API Migration'
            WHEN '3' THEN 'Bug Fix'
            WHEN '4' THEN 'Feature'
            WHEN '5' THEN 'Refactor'
            WHEN '6' THEN 'Security'
            WHEN '7' THEN 'Testing'
            WHEN '8' THEN 'CI/CD'
            WHEN '9' THEN 'Configuration'
            WHEN '10' THEN 'Documentation'
            WHEN '11' THEN 'Code Quality'
            WHEN '12' THEN 'Performance'
            WHEN '13' THEN 'Observability'
            WHEN '14' THEN 'Compliance'
            WHEN '15' THEN 'Other'
            ELSE JSON_VALUE(parameters.metadata, '$.secondaryIntent')
          END
      END
    label: ABC Secondary Intent
    group_label: ABC Categorization

  # ── DS Evergreen ──────────────────────────────────────────────
  evergreen_article_doc_count:
    sql: |-
      CASE
        WHEN ${event_name} = 'deepsearch:evergreen.list'
        THEN CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.docCount') AS INT64)
        ELSE NULL
      END
    group_label: DS Evergreen

  article_id:
    sql: |-
      CASE
        WHEN ${event_name} LIKE '%deepsearch:evergreen%'
        THEN CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.id') AS INT64)
        ELSE NULL
      END
    group_label: DS Evergreen

  # ── Deep Search Slack ─────────────────────────────────────────
  slack_ds_in_thread:
    sql: CASE WHEN JSON_VALUE(parameters.metadata, '$.inThread') = '1' THEN TRUE
      ELSE FALSE END
    group_label: Deep Search Slack

  # ── MCP ───────────────────────────────────────────────────────
  mcp_tool_call_category:
    sql: CASE WHEN ${event_name} = 'search:mcp.toolcall' THEN
      ${toolcall_category_mapping} END
    label: MCP Tool Call Category
    group_label: MCP

  mcp_tool_call_category_split:
    sql: |-
      CASE
        WHEN ${event_name} = 'search:mcp.toolcall'
             AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') <> '19' THEN
          CASE
            WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') NOT IN ('16','17')
              THEN 'MCP Tool excl. Deep Search'
            WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.toolCallId') IN ('16','17')
              THEN 'Deep Search MCP Tools'
          END
      END
    label: MCP Tool Split (DS vs. non-DS)
    group_label: MCP

  mcp_endpoint:
    sql: |-
      CASE WHEN ${event_name} = 'search:mcp.toolcall' THEN
        CASE JSON_EXTRACT_SCALAR(parameters.metadata, '$.endpoint')
          WHEN '1' THEN 'MCP'
          WHEN '2' THEN 'MCPV1'
          WHEN '3' THEN 'DeepSearch'
          WHEN '4' THEN 'DeepSearchPlumbing'
        END
      END
    group_label: MCP

  mcp_terminal_state:
    sql: |-
      CASE WHEN ${event_name} = 'search:mcp.toolcall' THEN
        CASE JSON_EXTRACT_SCALAR(parameters.metadata, '$.terminalState')
          WHEN '1' THEN 'Success'
          WHEN '2' THEN 'Failure'
          WHEN '3' THEN 'Timeout'
          ELSE JSON_EXTRACT_SCALAR(parameters.metadata, '$.terminalState')
        END
      END
    group_label: MCP

  mcp_duration:
    sql: |-
      CASE
        WHEN ${event_name} = 'search:mcp.toolcall'
        THEN CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS INT64)
        ELSE NULL
      END
    label: MCP Duration (in Ms)
    group_label: MCP

  mcp_output_length:
    sql: |-
      CASE
        WHEN ${event_name} = 'search:mcp.toolcall'
        THEN CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.outputLength') AS INT64)
        ELSE NULL
      END
    group_label: MCP

  mcp_output_length_bucket:
    sql: |-
      CASE
        WHEN ${mcp_output_length} IS NULL THEN NULL
        WHEN ${mcp_output_length} < 500 THEN '0-500'
        WHEN ${mcp_output_length} < 1000 THEN '500-1k'
        WHEN ${mcp_output_length} < 5000 THEN '1-5k'
        WHEN ${mcp_output_length} < 20000 THEN '5-20k'
        WHEN ${mcp_output_length} < 50000 THEN '20-50k'
        WHEN ${mcp_output_length} < 100000 THEN '50-100k'
        ELSE '100k+'
      END
    group_label: MCP

  mcp_output_length_bucket_sort:
    sql: |-
      CASE
        WHEN ${mcp_output_length} IS NULL THEN NULL
        WHEN ${mcp_output_length} < 500 THEN 1
        WHEN ${mcp_output_length} < 1000 THEN 2
        WHEN ${mcp_output_length} < 5000 THEN 3
        WHEN ${mcp_output_length} < 20000 THEN 4
        WHEN ${mcp_output_length} < 50000 THEN 5
        WHEN ${mcp_output_length} < 100000 THEN 6
        ELSE 7
      END
    group_label: MCP

  # ── AI Query Assist ───────────────────────────────────────────
  suggestion_applied:
    sql: |-
      CASE
        WHEN ${event_name} = 'search.nls:exit'
             AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.suggestionApplied') = '1' THEN TRUE
        ELSE FALSE
      END
    group_label: AI Query Assist

  exit_reason:
    sql: |-
      CASE
        WHEN ${event_name} != 'search.nls:exit' THEN NULL
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.exitReason') = '0' THEN 'Execute'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.exitReason') = '1' THEN 'Escape'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.exitReason') = '2' THEN 'Backspace'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.exitReason') = '3' THEN 'Programmatic'
        ELSE JSON_EXTRACT_SCALAR(parameters.metadata, '$.exitReason')
      END
    group_label: AI Query Assist

  accidental_entry:
    sql: |-
      CASE
        WHEN ${event_name} = 'search.nls:exit'
             AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.isAccidental') = '1' THEN TRUE
        ELSE FALSE
      END
    group_label: AI Query Assist

  api_status:
    sql: |-
      CASE
        WHEN ${event_name} != 'search.nls:apiResult' THEN NULL
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.status') = '0' THEN 'Success'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.status') = '1' THEN 'Empty'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.status') = '2' THEN 'Error'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.status') = '3' THEN 'Pending'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.status') = '4' THEN 'Not Requested'
        WHEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.status') = '5' THEN 'Aborted'
        ELSE JSON_EXTRACT_SCALAR(parameters.metadata, '$.status')
      END
    group_label: AI Query Assist

  api_error_code:
    sql: |-
      CASE
        WHEN ${event_name} = 'search.nls:apiResult' AND ${api_status} = 'Error'
        THEN JSON_EXTRACT_SCALAR(parameters.metadata, '$.errorCode')
      END
    group_label: AI Query Assist

  ai_query_abort:
    sql: |-
      CASE
        WHEN ${event_name} = 'search.nls:exit'
             AND JSON_EXTRACT_SCALAR(parameters.metadata, '$.aborted') = '1' THEN TRUE
        ELSE FALSE
      END
    group_label: AI Query Assist

  # ── ABC (Agentic Batch Changes) ───────────────────────────────
  abc_batch_change_id:
    sql: JSON_VALUE(${parameters_metadata}, '$.batchChangeID')
    group_label: ABC
    hidden: true

  abc_changeset_id:
    sql: JSON_VALUE(${parameters_metadata}, '$.changesetID')
    group_label: ABC
    hidden: true

  abc_current_op:
    sql: SAFE_CAST(JSON_VALUE(${parameters_metadata}, '$.currentOp') AS INT64)
    group_label: ABC
    hidden: true

  abc_has_error:
    sql: SAFE_CAST(JSON_VALUE(${parameters_metadata}, '$.hasError') AS INT64)
    group_label: ABC
    hidden: true

  abc_tool_call_id:
    sql: SAFE_CAST(JSON_VALUE(${parameters_metadata}, '$.toolCallId') AS INT64)
    group_label: ABC
    hidden: true

  # ── Batch Changes ─────────────────────────────────────────────
  metadata_haserror:
    sql: JSON_EXTRACT_SCALAR(parameters.metadata, '$.hasError')
    group_label: Batch Changes

  changeset_id:
    sql: JSON_VALUE(parameters.metadata, '$.changesetID')
    group_label: Batch Changes

  code_finder_filter:
    sql: |
      (${event_name} = 'metering:consume'
        AND ${metering_sku} = 3)
    hidden: true

  smart_hover_filter:
    sql: |
      (${event_name} = 'metering:consume'
        AND ${metering_sku} = 2)
    hidden: true

  diff_tour_filter:
    sql: |
      (${event_name} = 'metering:consume'
        AND ${metering_sku} = 6)
    hidden: true
    # ── Shared helper (used by several measures below) ─────────────

measures:
  count:
    label: Events Count
    aggregate_type: count

  distinct_users:
    sql: ${unique_user_id}
    group_label: Count Distinct Users
    aggregate_type: count_distinct

  chat_events:
    sql: CASE WHEN (${event_name} = 'cody.chat:submit' OR ${event_name} =
      'cody.chat-question:executed' OR ${event_name} =
      'cody.recipe.inline-chat:executed') THEN 1 END
    group_label: Chat Data
    aggregate_type: count

  chat_users:
    sql: |-
      CASE
                  WHEN (${event_name} = "cody.chat:submit" OR ${event_name} = "cody.chat-question:executed" OR ${event_name} = "cody.recipe.inline-chat:executed")
                  THEN ${unique_user_id} ELSE NULL END
    group_label: Chat Data
    aggregate_type: count_distinct

  command_events:
    sql: CASE WHEN (${event_name} LIKE '%command%' OR ${event_name} LIKE '%recipe%')
      AND ${event_name} NOT LIKE '%chat%' AND ${sourcegrapgh_v2_product} =
      'cody' THEN 1 END
    group_label: Commands Data
    aggregate_type: count

  command_users:
    sql: |-
      CASE WHEN ${sourcegrapgh_v2_product} = 'cody' THEN CASE
                  WHEN (
                  (${event_name} LIKE "%command%" or ${event_name} LIKE "%recipe%")
                  AND ${event_name} NOT LIKE "%chat%")
                  THEN ${unique_user_id} ELSE NULL END END
    group_label: Commands Data
    aggregate_type: count_distinct

  lines_of_code:
    sql: CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.lineCount') as INT64)
    label: Lines of Code (lineCount metadata)
    description: lineCount metadata (unfiltered)
    aggregate_type: sum

  count_distinct_cody_billign_active_users:
    sql: CASE WHEN ${is_billing_event} = TRUE AND ${sourcegrapgh_v2_product} =
      "cody" AND ${service_account} = FALSE THEN ${unique_user_id} END
    label: Cody Users
    group_label: Count Distinct Users
    aggregate_type: count_distinct

  count_distinct_search_submitted_users:
    sql: |-
      CASE WHEN ${event_name} = "search:submit" AND ${service_account} = FALSE THEN ${unique_user_id} ELSE
            null END
    label: UI Search Users
    group_label: Count Distinct Users
    aggregate_type: count_distinct

  count_distinct_search_users:
    sql: |-
      CASE WHEN (${sourcegrapgh_v2_product} = "search" AND ${is_billing_event} = TRUE AND ${service_account} = FALSE) 
            THEN ${unique_user_id} ELSE
            null END
    label: Search Users
    group_label: Count Distinct Users
    aggregate_type: count_distinct

  search_submitted:
    sql: CASE WHEN ${event_name} = 'search:submit' THEN 1 END
    label: Search Submitted Count
    group_label: Search Events
    aggregate_type: count

  code_intel_hover:
    sql: CASE WHEN (${event_name} = 'blob.codeintel:lsifHover' OR ${event_name} =
      'blob.codeintel:searchHover' OR ${event_name} =
      'codeintel.hovercard:view') THEN 1 END
    group_label: Search Events
    aggregate_type: count

  code_intel_gotodef:
    sql: CASE WHEN (${event_name} = 'blob.codeintel:searchDefinitions' OR
      ${event_name} = 'blob.codeintel:lsifDefinitions' OR ${event_name} =
      'codeintel:goToDefinition' OR ${event_name} =
      'codeintel.explorePanel:definitions.click') THEN 1 END
    group_label: Search Events
    aggregate_type: count

  code_intel_highlight:
    sql: CASE WHEN (${event_name} = 'blob.codeintel:searchDocumentHighlight' OR
      ${event_name} = 'blob.codeintel:lsifDocumentHighlight') THEN 1 END
    group_label: Search Events
    aggregate_type: count

  search_find_references:
    sql: CASE WHEN (${event_name} = 'blob.findReferences:executed' OR ${event_name}
      = 'codeintel:findReferences' OR ${event_name} =
      'codeintel.explorePanel:references.click') THEN 1 END
    label: Code Intel Find References
    group_label: Search Events
    aggregate_type: count

  code_copied:
    sql: CASE WHEN (${event_name} = 'code:copy' OR ${event_name} = 'blob.code:copy'
      OR ${event_name} = 'repo.blob.code:copy') THEN 1 END
    group_label: Search Events
    aggregate_type: count

  code_insights_events:
    sql: CASE WHEN ${sourcegrapgh_v2_product} = 'insight' THEN 1 END
    group_label: Search Events
    aggregate_type: count

  batch_changes_events:
    sql: CASE WHEN ${sourcegrapgh_v2_product} = 'batch' THEN 1 END
    group_label: Search Events
    aggregate_type: count

  search_events:
    sql: CASE WHEN ${sourcegrapgh_v2_product} = 'search' THEN 1 END
    group_label: Search Events
    description: All search events
    aggregate_type: count

  search_latencies_events:
    sql: CASE WHEN ${event_name} LIKE 'search.latencies%' THEN 1 END
    group_label: Search Events
    description: All search latencies events
    aggregate_type: count

  search_billing_events:
    sql: CASE WHEN (${sourcegrapgh_v2_product} = 'search' OR
      ${sourcegrapgh_v2_product} = 'insight' OR ${sourcegrapgh_v2_product} =
      'batch') AND ${is_billing_event} = 'Yes' THEN 1 END
    label: Search Billing Events
    group_label: Search Events
    aggregate_type: count

  total_active_users:
    sql: case when ${is_billing_event} = true AND ${service_account} = FALSE then
      ${unique_user_id} else null end
    group_label: Count Distinct Users
    description: Count distinct billing users
    aggregate_type: count_distinct

  count_completion_events:
    sql: CASE WHEN ${event_name} LIKE '%completion%' THEN 1 END
    label: Completion Events
    group_label: Completion Data
    aggregate_type: count

  code_search_suite_users:
    sql: CASE WHEN (${billing_metadata_product} = 'search' OR
      ${billing_metadata_product} = 'batch' OR ${billing_metadata_product} =
      'insights') AND (${billing_metadata_category} = 'core' OR
      ${billing_metadata_category} = 'billable') THEN ${unique_user_id} END
    label: All billable code search suite users
    description: All users who fired any search, batch, or insights event
    hidden: true
    aggregate_type: count_distinct

  code_search_suite_ui_users:
    sql: CASE WHEN ${billing_metadata_product} != 'cody' AND ${event_name} NOT LIKE
      'search.latencies%' AND (${billing_metadata_category} = 'core' OR
      ${billing_metadata_category} = 'billable') THEN ${unique_user_id} END
    label: All code search UI users
    description: All users who fired a non-cody event, in the search UI. Excludes
      API search events
    hidden: true
    aggregate_type: count_distinct

  code_intel_actions_count:
    sql: CASE WHEN ${event_name} LIKE '%codeintel%' AND ${is_billing_event} = TRUE
      THEN 1 END
    label: Code Intel Events
    group_label: Search Events
    aggregate_type: count

  code_intel_actions_users:
    sql: CASE WHEN ${event_name} LIKE '%codeintel%' AND ${is_billing_event} = TRUE
      AND ${service_account} = FALSE THEN ${unique_user_id} END
    label: Code Intel Users
    group_label: Search Events
    aggregate_type: count_distinct

  search_latency_literal:
    sql: CASE WHEN ${event_name} = 'search.latencies:literal' THEN 1 END
    label: Search Latency Literal
    group_label: Search Latency
    description: Search Latency Literal
    aggregate_type: count

  search_latency_structural:
    sql: CASE WHEN ${event_name} = 'search.latencies:structural' THEN 1 END
    label: Search Latency Structural
    group_label: Search Latency
    description: Search Latency Structural
    aggregate_type: count

  search_latency_regexp:
    sql: CASE WHEN (${event_name} = 'search.latencies:regexp' OR ${event_name} =
      'search.latencies:regex') THEN 1 END
    label: Search Latency Regex/Regexp
    group_label: Search Latency
    description: Search Latency Regexp
    aggregate_type: count

  search_latency_keyword:
    sql: CASE WHEN ${event_name} = 'search.latencies:keyword' THEN 1 END
    label: Search Latency Keyword
    group_label: Search Latency
    description: Search Latency Keyword
    aggregate_type: count

  search_latency_literal_duration:
    sql: CASE WHEN ${event_name} = 'search.latencies:literal' THEN
      SAFE_CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS
      INT64) END
    label: Search Latency Literal Duration
    group_label: Search Latency
    format: number_1
    description: Avg duration for literal search latency events
    aggregate_type: average

  search_latency_regex_p_duration:
    sql: CASE WHEN (${event_name} = 'search.latencies:regexp' OR ${event_name} =
      'search.latencies:regex') THEN
      SAFE_CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS
      INT64) END
    label: Search Latency Regex/Regexp Duration
    group_label: Search Latency
    format: number_1
    description: Avg duration for Regex/Regexp search latency events
    aggregate_type: average

  search_latency_structural_duration:
    sql: CASE WHEN ${event_name} = 'search.latencies:structural' THEN
      SAFE_CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS
      INT64) END
    label: Search Latency Structural Duration
    group_label: Search Latency
    format: number_1
    description: Avg duration for structural search latency events
    aggregate_type: average

  search_latency_keyword_duration:
    sql: CASE WHEN ${event_name} = 'search.latencies:keyword' THEN
      SAFE_CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS
      INT64) END
    label: Search Latency Keyword Duration
    group_label: Search Latency
    format: number_1
    description: Avg duration for keyword search latency events
    aggregate_type: average

  billing_active_users:
    sql: CASE WHEN ${is_billing_event} = TRUE THEN ${unique_user_id} END
    group_label: D&A ONLY
    aggregate_type: count_distinct

  core_active_users:
    sql: CASE WHEN ${is_core_event} = 'Yes' THEN ${unique_user_id} END
    group_label: D&A ONLY
    aggregate_type: count_distinct

  search_only_users:
    sql: CASE WHEN ${is_billing_event} = TRUE THEN CASE WHEN
      ${sourcegrapgh_v2_product} NOT IN ("cody","other") THEN ${unique_user_id}
      ELSE NULL END END
    group_label: D&A ONLY
    aggregate_type: count_distinct

  cody_only_users:
    sql: CASE WHEN ${is_billing_event} = TRUE THEN CASE WHEN
      ${sourcegrapgh_v2_product} = "cody" THEN ${unique_user_id} ELSE NULL END
      END
    group_label: D&A ONLY
    aggregate_type: count_distinct

  code_insight_view:
    sql: CASE WHEN (${event_name} = 'insight:view' OR ${event_name} =
      'insights.dashboard:view') THEN 1 END
    group_label: Search Events
    aggregate_type: count

  code_insight_view_users:
    sql: CASE WHEN (${event_name} = 'insight:view' OR ${event_name} =
      'insights.dashboard:view') THEN ${unique_user_id} END
    group_label: Search Events
    aggregate_type: count_distinct

  batch_change_published:
    sql: CASE WHEN ${event_name} = 'batches:executorRunOperation' AND
      ${metadata_currentop} = '4' THEN 1 END
    label: Batch Changesets Published
    group_label: Batch Changes
    aggregate_type: count

  batch_change_merged:
    sql: CASE WHEN ${event_name} = 'batchChange.details.bulkAction:merge' THEN 1 END
    label: Batch Changes Merged (UI)
    group_label: Batch Changes
    aggregate_type: count

  batch_changesets_merged:
    sql: CASE WHEN ${event_name} = 'batches:changesetMerged' THEN 1 END
    label: Batch Changesets Merged (Server)
    group_label: Batch Changes
    aggregate_type: count

  batch_change_opened:
    sql: CASE WHEN ${event_name} = 'batchChange.details:view' THEN 1 END
    group_label: Batch Changes
    aggregate_type: count

  batch_change_run:
    sql: CASE WHEN ${event_name} = 'batches:executeBatchSpec' THEN 1 END
    label: Batch Specs Executed/Run
    group_label: Batch Changes
    aggregate_type: count

  batch_change_created:
    sql: CASE WHEN ${event_name} = 'batches:createBatchSpecComplete' THEN 1 END
    label: Batch Specs Created
    group_label: Batch Changes
    aggregate_type: count

  cody_api_duration:
    sql: CASE WHEN ${event_name} LIKE '%cody.api%' THEN
      SAFE_CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS
      INT64) END
    label: Avg duration for Cody API Retrieval
    group_label: Cody API
    format: number_1
    description: Avg duration for Cody API Retrieval
    aggregate_type: average

  cody_api_duration_p75:
    sql: CASE WHEN ${event_name} LIKE '%cody.api%' THEN
      SAFE_CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS
      INT64) END
    label: p75 duration for Cody API Retrieval
    group_label: Cody API
    format: number_1
    description: p75 duration for Cody API Retrieval
    aggregate_type: percentile
    percentile: 75

  cody_api_duration_p75_completions:
    sql: CASE WHEN ${event_name} = 'cody.api.completionsCode:succeeded' THEN
      SAFE_CAST(JSON_EXTRACT_SCALAR(parameters.metadata, '$.durationMs') AS
      INT64) END
    label: p75 duration for Cody Completions API Retrieval
    group_label: Cody API
    format: number_1
    description: p75 duration for Completions Cody API Retrieval
