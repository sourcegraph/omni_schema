description: Dotcom PG table replication

catalog: telligentsourcegraph
schema: sourcegraph_analytics
table_name: org_invitations

dimensions:
  created_at: {}
  notified_at: {}
  responded_at: {}
  response_type: {}
  revoked_at: {}
  deleted_at: {}
  recipient_email: {}
  expires_at: {}

  id:
