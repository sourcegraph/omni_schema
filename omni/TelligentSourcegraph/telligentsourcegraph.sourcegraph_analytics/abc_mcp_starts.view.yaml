# Reference this view as telligentsourcegraph_sourcegraph_analytics__abc_mcp_starts
catalog: telligentsourcegraph
schema: sourcegraph_analytics
table_name: abc_mcp_starts

dimensions:
  agent_key: {}
  is_internal_instance: {}
  external_url: {}
  observed_start_at: {}
  start_mode: {}
  start_client: {}
  prompted_at: {}
  workspaces_resolved_at: {}
  workspaces_run_at: {}
  published_at: {}
  merged_at: {}
  customer_key: {}
  customer_name: {}
  is_service_account: {}

  agent_id:
    format: ID

measures:
  count:
    aggregate_type: count

  runs:
    sql: ${agent_key}
    label: MCP-started runs
    aggregate_type: count_distinct

  runs_prompted:
    sql: CASE WHEN ${prompted_at} IS NOT NULL THEN ${agent_key} END
    label: Runs prompted
    aggregate_type: count_distinct

  runs_workspaces_resolved:
    sql: CASE WHEN ${workspaces_resolved_at} IS NOT NULL THEN ${agent_key} END
    label: Runs with resolved workspaces
    aggregate_type: count_distinct

  runs_workspaces_run:
    sql: CASE WHEN ${workspaces_run_at} IS NOT NULL THEN ${agent_key} END
    label: Runs with executed workspaces
    aggregate_type: count_distinct

  runs_published:
    sql: CASE WHEN ${published_at} IS NOT NULL THEN ${agent_key} END
    label: Runs with a published changeset
    aggregate_type: count_distinct

  runs_merged:
    sql: CASE WHEN ${merged_at} IS NOT NULL THEN ${agent_key} END
    label: Runs with a merged changeset
    aggregate_type: count_distinct

  start_to_merge_conversion:
    sql: SAFE_DIVIDE(${runs_merged}, ${runs})
    label: MCP Start-to-merge conversion
    format: percent_1
    description: Merged agents divided by all attributed MCP-started agents. Not
      merged PR count or billing.
