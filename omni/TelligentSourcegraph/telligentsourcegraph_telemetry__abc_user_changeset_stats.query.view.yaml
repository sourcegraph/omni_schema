# Reference this view as telligentsourcegraph_telemetry__abc_user_changeset_stats
label: ABC User Changeset Stats
description: One row per ABC user and instance with changesets created, closed
  and merged, attributed to the user through their batch changes. Mirrors the
  ABC user breakdown logic. Covers the last 90 days only, because a derived view
  cannot take the dashboard date filter.

sql: |-
  WITH ubc AS (
    SELECT DISTINCT e.uniqueUserId AS unique_user_id, e.externalUrl AS external_url, SAFE_CAST(JSON_VALUE(e.parameters.metadata, '$.batchChangeID') AS INT64) AS batch_change_id
    FROM telligentsourcegraph.telemetry.v2_events e
    WHERE e.timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)
      AND e.feature = 'batchChangeAgent.processMessage'
      AND JSON_VALUE(e.parameters.metadata, '$.batchChangeID') IS NOT NULL
      AND JSON_VALUE(e.parameters.metadata, '$.batchChangeID') NOT IN ('0', '')
  ), base_users AS (
    SELECT DISTINCT e.uniqueUserId AS unique_user_id, e.externalUrl AS external_url
    FROM telligentsourcegraph.telemetry.v2_events e
    WHERE e.timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)
      AND e.eventName = 'batchChangeAgent.processMessage:succeeded'
  ), ucm AS (
    SELECT DISTINCT ubc.unique_user_id, ubc.external_url, JSON_VALUE(e.parameters.metadata, '$.changesetID') AS changeset_id
    FROM telligentsourcegraph.telemetry.v2_events e
    JOIN ubc ON SAFE_CAST(JSON_VALUE(e.parameters.metadata, '$.batchChangeID') AS INT64) = ubc.batch_change_id AND e.externalUrl = ubc.external_url
    WHERE e.timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)
      AND e.feature = 'batches' AND e.action = 'processChangesetJob'
  ), cs AS (
    SELECT ucm.unique_user_id, ucm.external_url,
      COUNT(DISTINCT CASE WHEN SAFE_CAST(JSON_VALUE(e.parameters.metadata, '$.currentOp') AS INT64) IN (4, 5) THEN ucm.changeset_id END) AS changesets_created,
      COUNT(DISTINCT CASE WHEN SAFE_CAST(JSON_VALUE(e.parameters.metadata, '$.currentOp') AS INT64) = 9 THEN ucm.changeset_id END) AS changesets_closed
    FROM telligentsourcegraph.telemetry.v2_events e
    JOIN ucm ON JSON_VALUE(e.parameters.metadata, '$.changesetID') = ucm.changeset_id AND e.externalUrl = ucm.external_url
    WHERE e.timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)
      AND e.feature = 'batches' AND e.action = 'executorRunOperation'
      AND SAFE_CAST(JSON_VALUE(e.parameters.metadata, '$.hasError') AS INT64) = 0
    GROUP BY 1, 2
  ), ms AS (
    SELECT unique_user_id, external_url, COUNT(DISTINCT changeset_id) AS changesets_merged
    FROM (
      SELECT DISTINCT COALESCE(ubc.unique_user_id, ucm.unique_user_id) AS unique_user_id, m.external_url, m.changeset_id
      FROM (
        SELECT externalUrl AS external_url,
          SAFE_CAST(JSON_VALUE(parameters.metadata, '$.batchChangeID') AS INT64) AS batch_change_id,
          JSON_VALUE(parameters.metadata, '$.changesetID') AS changeset_id
        FROM telligentsourcegraph.telemetry.v2_events
        WHERE timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 90 DAY)
          AND feature = 'batches' AND action = 'changesetMerged'
      ) m
      LEFT JOIN ubc ON m.batch_change_id = ubc.batch_change_id AND m.external_url = ubc.external_url
      LEFT JOIN ucm ON m.changeset_id = ucm.changeset_id AND m.external_url = ucm.external_url
      WHERE ubc.batch_change_id IS NOT NULL OR ucm.changeset_id IS NOT NULL
    )
    GROUP BY 1, 2
  )
  SELECT b.unique_user_id, b.external_url,
    COALESCE(cs.changesets_created, 0) AS changesets_created,
    COALESCE(cs.changesets_closed, 0) AS changesets_closed,
    COALESCE(ms.changesets_merged, 0) AS changesets_merged
  FROM base_users b
  LEFT JOIN cs ON b.unique_user_id = cs.unique_user_id AND b.external_url = cs.external_url
  LEFT JOIN ms ON b.unique_user_id = ms.unique_user_id AND b.external_url = ms.external_url

dimensions:
  user_key:
    sql: CONCAT(${unique_user_id}, '|', ${external_url})
    hidden: true
    primary_key: true

  unique_user_id:
    sql: unique_user_id
    label: Unique User ID
    format: ID

  external_url:
    sql: external_url
    label: External URL

  changesets_created:
    sql: changesets_created
    hidden: true

  changesets_closed:
    sql: changesets_closed
    hidden: true

  changesets_merged:
    sql: changesets_merged
    hidden: true

measures:
  abc_user_changesets_created:
    sql: ${changesets_created}
    label: ABC User Changesets Created
    group_label: ABC User Changesets
    aggregate_type: sum

  abc_user_changesets_closed:
    sql: ${changesets_closed}
    label: ABC User Changesets Closed
    group_label: ABC User Changesets
    aggregate_type: sum

  abc_user_changesets_merged:
    sql: ${changesets_merged}
    label: ABC User Changesets Merged
    group_label: ABC User Changesets
    aggregate_type: sum

  abc_user_changesets_still_open:
    sql: ${abc_user_changesets_created} - ${abc_user_changesets_merged} -
      ${abc_user_changesets_closed}
    label: ABC User Changesets Still Open
    group_label: ABC User Changesets

  abc_user_changeset_merged_pct:
    sql: SAFE_DIVIDE(${abc_user_changesets_merged},
      NULLIF(${abc_user_changesets_created}, 0))
    label: ABC User Changeset Merge %
    group_label: ABC User Changesets
    format: percent_1
